<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考自学手账 · 2027 新疆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --sidebar:#fbfbfe; --ink:#1b1f2a; --muted:#68707f;
  --line:#e7e9f0; --accent:#4f46e5; --accent-soft:#eef1ff; --accent-deep:#4338ca;
  --green:#16a34a; --green-soft:#e8f7ee; --amber:#b45309; --amber-soft:#fdf3e3;
  --red:#dc2626; --red-soft:#fdecec; --teal:#0d9488; --teal-soft:#e6f7f5;
  --pink:#db2777; --pink-soft:#fdeef5; --yellow:#f5d76e; --yellow-soft:#fef9e7;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
.app{display:flex;min-height:100vh}
.sidebar{width:216px;flex:0 0 216px;background:var(--sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 10px}
.logo{font-weight:800;font-size:16px;padding:2px 10px 14px}
.logo .sub{display:block;font-weight:400;font-size:11px;color:var(--muted)}
#nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:14px;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;font-family:inherit}
.nav-item:hover{background:var(--accent-soft);color:var(--accent)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.nav-item .ic{font-size:16px;line-height:1}
.side-foot{margin-top:auto;padding:12px 10px 2px;color:var(--muted);font-size:11px;line-height:1.5}
.main{flex:1;min-width:0}
/* 全铺满：去掉内容区居中与最大宽度 */
.content{padding:20px 22px 60px}
.view{display:none}
.view.on{display:block}
.grid{display:grid;gap:16px}
.grid-home{grid-template-columns:repeat(12,1fr)}
.col-12{grid-column:span 12}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}
@media(max-width:1100px){.col-6{grid-column:span 12}.col-4{grid-column:span 6}.col-3{grid-column:span 6}}
@media(max-width:640px){.col-4,.col-3{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.card h2{font-size:18px;margin:0 0 4px}
.card h3{font-size:15px;margin:16px 0 8px}
.card .lead{color:var(--muted);font-size:13px;margin:0 0 14px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.indigo{background:var(--accent-soft);color:var(--accent)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.pink{background:var(--pink-soft);color:var(--pink)}
.hero{background:linear-gradient(135deg,#4f46e5 0%,#6d28d9 55%,#7c3aed 100%);color:#fff;border:none;border-radius:18px;padding:24px 26px}
.hero .kicker{font-size:12px;opacity:.9;letter-spacing:.5px}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;margin:6px 0 2px}
.hero .sub{opacity:.92;font-size:13.5px}
.hero .stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:18px}
.hero .stat .num{font-size:24px;font-weight:700}
.hero .stat .lbl{font-size:12px;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:#fafbfd;font-weight:600;color:#374151;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{background:#fff;border:1px solid var(--line);border-radius:9px;text-align:center;padding:8px 2px;font-size:12px;cursor:pointer}
.wk .n{font-weight:700}
.wk.s0{background:#eef1ff}.wk.s1{background:#e0f2fe}.wk.s2{background:#d1fae5}.wk.s3{background:#fdf3e3}.wk.s4{background:#fce7f3}.wk.s5{background:#fde68a}.wk.s6{background:#fdecec}
.wk.cur{outline:3px solid var(--accent);font-weight:800}
.wk.done{opacity:.5}
.stage{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--line);padding:11px 15px;background:#fff;border-radius:10px;margin-bottom:8px}
.stage.cur{border-left-color:var(--accent);background:var(--accent-soft)}
/* 手账风格 */
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:7px;cursor:pointer}
.chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.chk.done{background:var(--green-soft);color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);border-radius:999px}
.sticker{background:var(--yellow-soft);border:1px solid #f0e0a0;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:8px}
.sticker b{display:block;margin-bottom:2px}
.sticker.pink{background:var(--pink-soft);border-color:#f3c4da}
.sticker.blue{background:var(--accent-soft);border-color:#cfd4ff}
.vid-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.vid-item .vtitle{flex:1;min-width:0;color:var(--accent);text-decoration:none}
.vid-item .vtitle:hover{text-decoration:underline}
.vid-item.watched .vtitle{color:var(--muted)}
.vid-item input{accent-color:var(--accent)}
.series{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.series-head{padding:11px 15px;background:#fafbfd;font-weight:600}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;text-decoration:none}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
input[type="checkbox"],input[type="radio"]{width:18px;height:18px;flex:0 0 auto;padding:0;border:0}
select{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px;margin:2px;cursor:pointer}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.aiout{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:60px;font-size:14px}
.aiout ul{margin:6px 0;padding-left:20px}
.aiout h3,.aiout h4{margin:12px 0 4px}
.aiout p{margin:6px 0}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.qhead{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qtext{font-weight:600;margin-bottom:10px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:14px}
.opt:hover{background:#fafbff}
.opt input{margin-right:8px}
.qinput{width:100%}
.qresult{margin-top:10px;font-size:14px}
.qresult.ok{color:var(--green)}
.qresult.bad{color:var(--red)}
.qresult .explain{margin-top:4px;color:var(--muted)}
.qsrc{color:var(--muted);font-size:12px}
.error{background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px 13px;font-size:13px;margin:8px 0}
.spin{color:var(--muted);font-size:13px}
.logline{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.logline .d{color:var(--muted);white-space:nowrap}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:6px}
  .logo{padding:0 6px 0 0;white-space:nowrap}
  .logo .sub{display:none}
  #nav{flex-direction:row;overflow-x:auto}
  .nav-item{width:auto}
  .side-foot{display:none}
  .content{padding:14px 12px 40px}
  .hero .big{font-size:32px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">🎯 高考自学<span class="sub">2027 新疆 · 物化生</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">数据保存在本机浏览器<br>政策信息以新疆教育考试院为准</div>
  </aside>
  <div class="main">
    <div class="content">
      <section id="view-home" class="view"></section>
      <section id="view-subject" class="view"></section>
      <section id="view-quiz" class="view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-settings" class="view"></section>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============ Supabase 云端配置（部署时填写，见「部署手册.md」） ============ */
var SUPABASE_URL = "https://auoixipbgeizigemkywt.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1b2l4aXBiZ2VpemlnZW1reXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjUzNTAsImV4cCI6MjEwMjQ0MTM1MH0.ir8qeprgD8Ri_gTmBMyNZcGedEtN5ZY-alyItOkKmzs";
var supabase = null;
var currentUser = { uid: "", name: "" };
try { currentUser = { uid: localStorage.getItem("gk_uid")||"", name: localStorage.getItem("gk_name")||"" }; } catch(e){}
var cloudReady = false;

function cloudEnabled(){ return SUPABASE_URL.indexOf("YOUR_") !== 0 && !!window.supabase; }
function genUid(){
  if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch(e){} }
  return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
async function initFlow(){
  if (!cloudEnabled()) { switchView("home"); return; }
  try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){ switchView("home"); return; }
  if (!currentUser.uid) {
    var name = prompt("欢迎使用高考自学手账！请先登记你的昵称（用于记录你的学习数据）：","");
    if (!name || !name.trim()) { switchView("home"); return; }
    currentUser = { uid: genUid(), name: name.trim() };
    localStorage.setItem("gk_uid", currentUser.uid);
    localStorage.setItem("gk_name", currentUser.name);
    try { await supabase.from("users").insert({id: currentUser.uid, name: currentUser.name}); } catch(e){}
  }
  cloudReady = true;
  await loadCloud();
  switchView("home");
}
async function loadCloud(){
  if (!cloudReady || !supabase) return;
  try {
    var chapters = {};
    var {data: pg} = await supabase.from("progress").select("*").eq("user_id", currentUser.uid);
    (pg||[]).forEach(function(r){ chapters[r.subject]=chapters[r.subject]||{}; chapters[r.subject][r.chapter]=r.count; });
    state.chapters = chapters;

    var log = state.log || {};
    var since = fmt(new Date(Date.now() - 7*MS_DAY));
    var {data: ck} = await supabase.from("checkins").select("*").eq("user_id", currentUser.uid).gte("date", since);
    (ck||[]).forEach(function(c){
      log[c.date] = log[c.date]||{};
      var subjLog = log[c.date][c.subject] || (log[c.date][c.subject]={done:true, entries:{}});
      subjLog.done = true;
      subjLog.entries[c.type] = (subjLog.entries[c.type]||0) + (c.count||0);
    });
    state.log = log;

    var reviews = {};
    var {data: rv} = await supabase.from("reviews").select("*").eq("user_id", currentUser.uid);
    (rv||[]).forEach(function(r){ reviews[r.week] = r.data||{}; });
    state.reviews = reviews;
    saveState();
  } catch(e){ /* 云端失败则用本地缓存 */ }
}
function cloudCheckin(subject, chapter, type, step, chapterCount){
  if (!cloudReady || !supabase) return;
  try {
    supabase.from("checkins").insert({user_id: currentUser.uid, name: currentUser.name, date: fmt(new Date()), subject: subject, chapter: chapter, type: type, count: step});
    supabase.from("progress").upsert({user_id: currentUser.uid, subject: subject, chapter: chapter, count: chapterCount});
  } catch(e){}
}

/* ============ 数据层（源自《2027新疆高考自学规划.md》） ============ */

  {no:4, name:"二轮专题", weeks:8, goal:"题型整合、限时训练、补弱", ratio:"看课15% / 做题70% / 复盘15%"},
  {no:5, name:"三轮实战", weeks:4, goal:"全真模拟、时间分配、稳定输出", ratio:"看课10% / 做题75% / 复盘15%"},
  {no:6, name:"考前收束", weeks:2, goal:"回归教材错题、保持手感与睡眠", ratio:"看课5% / 做题55% / 复盘40%"}
];

var WEEK_GROUPS = [
  {from:1,to:1, main:"办理政策核验；六科各做一次分模块诊断；只恢复作息，不追课", check:"形成《报名/合格考清单》《六科薄弱章清单》《42周分数记录表》"},
  {from:2,to:3, main:"数：初高衔接、集合、不等式；物：运动描述、匀变速；化：物质分类、物质的量；生：细胞与化合物；语：信息类阅读；英：音标/句子成分+核心词", check:"基础题正确率≥70%"},

  {from:16,to:17, main:"数：圆锥曲线基础；物：恒定电流；化：电化学；生：内环境、神经调节；语：小说散文；英：语法填空", check:"6科模块测；正确率≥75%标「已过一轮」"},

var DAILY_BLOCKS = [
  {time:"07:30—08:10", name:"英语词汇30分钟 + 古诗文/语文积累10分钟"},
  {time:"08:20—10:20", name:"数学主块120分钟"},
  {time:"10:40—11:40", name:"语文或英语60分钟"},

/* ============ 日期与工具 ============ */
var MS_DAY = 86400000;
function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function weekOf(d){ var diff = Math.floor((d - START)/MS_DAY); if(diff<0) return 0; var w = Math.floor(diff/7)+1; if(w>42) return 43; return w; }
function stageOfWeek(w){ if(w<1||w>42) return null; if(w===1) return 0; if(w<=9) return 1; if(w<=19) return 2; if(w<=28) return 3; if(w<=36) return 4; if(w<=40) return 5; return 6; }
function weekRange(w){ var s=new Date(START.getTime()+(w-1)*7*MS_DAY); var e=new Date(s.getTime()+6*MS_DAY); return {start:s,end:e}; }
function stageRange(si){ var sw=1; for(var i=0;i<si;i++) sw+=STAGES[i].weeks; var ew=sw+STAGES[si].weeks-1; return {start:weekRange(sw).start,end:weekRange(ew).end,startWeek:sw,endWeek:ew}; }
function findGroup(w){ for(var i=0;i<WEEK_GROUPS.length;i++){ var g=WEEK_GROUPS[i]; if(w>=g.from&&w<=g.to) return g; } return null; }
function daysToExam(d){ return Math.floor((EXAM-d)/MS_DAY); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mdToHtml(s){
  s=s||""; s=String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  var lines=s.split("\n"), html="", inList=false;
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(/^###\s+/.test(t)){ if(inList){html+="</ul>";inList=false;} html+="<h4>"+t.replace(/^###\s+/,"")+"</h4>"; }
    else if(/^##\s+/.test(t)){ if(inList){html+="</ul>";inList=false;} html+="<h3>"+t.replace(/^##\s+/,"")+"</h3>"; }
    else if(/^#\s+/.test(t)){ if(inList){html+="</ul>";inList=false;} html+="<h3>"+t.replace(/^#\s+/,"")+"</h3>"; }
    else if(/^[-*]\s+/.test(t)){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+t.replace(/^[-*]\s+/,"")+"</li>"; }
    else if(/^\d+[.、)]\s*/.test(t)){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+t+"</li>"; }
    else if(t===""){ if(inList){html+="</ul>";inList=false;} }
    else { html+="<p>"+t+"</p>"; }
  }
  if(inList) html+="</ul>";
  return html;
}
function normAns(s){ return String(s==null?"":s).trim().toLowerCase().replace(/\s+/g," "); }
function isCorrect(user,ref){ var u=normAns(user), r=normAns(ref); if(!u) return false; if(u===r) return true; return u.indexOf(r)>=0 || r.indexOf(u)>=0; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ============ 自测（纯真题题库） ============ */
function getBankQuestions(subjectKey, point, count){
  var pool=(QUESTION_BANK[subjectKey]||[]).concat(state.importedBank[subjectKey]||[]);
  pool=pool.filter(function(q){ return q && q.q && q.answer && state.flagged.indexOf(q.q)<0; });
  var byPoint=pool.filter(function(q){ return q.point===point; });
  var rest=pool.filter(function(q){ return q.point!==point; });
  return shuffle(byPoint).concat(shuffle(rest)).slice(0,count);
}

  html+='<div class="card"><h2>历史复盘</h2><div class="tbl-wrap"><table><tr><th>周</th>'; METRIC_SHORT.forEach(function(m){ html+='<th>'+m+'</th>'; }); html+='</tr>';
  var weeks=Object.keys(state.reviews).map(Number).sort(function(a,b){return b-a;});
  if(weeks.length===0){ html+='<tr><td colspan="7" class="muted">暂无记录</td></tr>'; }
  weeks.forEach(function(wn){ var rr=state.reviews[wn]||{}; html+='<tr><td>W'+wn+'</td>'; WEEKLY_METRICS.forEach(function(m){ html+='<td>'+esc(rr[m.key]||"—")+'</td>'; }); html+='</tr>'; });
  html+='</table></div></div>';
  el.innerHTML=html;
}
function saveReview(){
  var wk=parseInt(document.getElementById("reviewWeek").value); var r=state.reviews[wk]||{};
  WEEKLY_METRICS.forEach(function(m){ var inp=document.querySelector('input[data-metric="'+m.key+'"]'); var v=inp?inp.value.trim():""; if(v) r[m.key]=v; else delete r[m.key]; });
  state.reviews[wk]=r; saveState(); document.getElementById("reviewMsg").textContent="已保存 W"+wk+" ✓";
  if (cloudReady && supabase) { try { supabase.from("reviews").upsert({user_id: currentUser.uid, week: wk, data: r}, {onConflict: "user_id,week"}); } catch(e){} }
}

/* ============ 设置与备份 ============ */
function renderSettings(){
  var el=document.getElementById("view-settings"); var s=state.settings;
  var html='<div class="card"><h2>AI 设置（仅知识梳理用）</h2><p class="lead">自测题已改为真题题库、不依赖 AI。此项仅用于「AI 知识梳理」，可不填。</p>';
  html+='<div class="field"><label>服务商</label><select id="setProvider">'; Object.keys(PROVIDERS).forEach(function(p){ html+='<option value="'+p+'"'+(s.provider===p?" selected":"")+'>'+p+'</option>'; }); html+='</select></div>';
  html+='<div class="field"><label>接口地址 Base URL</label><input id="setBaseUrl" value="'+esc(s.baseUrl)+'"></div>';
  html+='<div class="field"><label>模型</label><input id="setModel" value="'+esc(s.model)+'"></div>';
  html+='<div class="field"><label>API Key</label><input id="setKey" type="password" value="'+esc(s.apiKey)+'" placeholder="sk-..."></div>';
  html+='<button class="btn" data-action="saveSettings">保存设置</button> <span id="setMsg" class="muted"></span>';
  if(!storageOK) html+='<div class="error">当前浏览器无法使用本地存储，进度可能无法保存。</div></div>';
  html+='<div class="card"><h2>题库导入</h2><p class="lead">导入 JSON 题库文件扩充自测。格式：{科目key:[{point,type,q,options,answer,explain,source}]}，科目 key 为 chinese/math/english/physics/chemistry/biology。</p>';
  html+='<button class="btn" data-action="importBank">导入题库 JSON</button> <input type="file" id="bankFile" accept="application/json" style="display:none"><span id="bankMsg" class="muted"></span></div>';
  html+='<div class="card"><h2>数据备份</h2><p class="lead">导出全部进度（含打卡、章节、题库）为 JSON。</p>';
  html+='<button class="btn" data-action="export">导出数据</button> <button class="btn ghost" data-action="import">导入数据</button> <input type="file" id="importFile" accept="application/json" style="display:none"></div>';
  el.innerHTML=html;
}
function saveSettings(){
  state.settings.provider=document.getElementById("setProvider").value;
  state.settings.baseUrl=document.getElementById("setBaseUrl").value.trim();
  state.settings.model=document.getElementById("setModel").value.trim();
  state.settings.apiKey=document.getElementById("setKey").value.trim();
  saveState(); document.getElementById("setMsg").textContent="已保存 ✓";
}
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="高考自学数据备份_"+fmt(new Date())+".json";
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{ var obj=JSON.parse(fr.result);
      state={ settings:Object.assign(memStore().settings,obj.settings||{}), daily:obj.daily||{}, reviews:obj.reviews||{}, watched:obj.watched||{}, custom:obj.custom||{}, flagged:obj.flagged||[], chapters:obj.chapters||{}, log:obj.log||{}, importedBank:obj.importedBank||{} };
      saveState(); switchView(currentView); alert("导入成功");
    }catch(e){ alert("导入失败：文件格式不对。\n"+e.message); }
  };
  fr.readAsText(file);
}
function importBank(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var obj=JSON.parse(fr.result);
      var bank=(obj && obj.bank)?obj.bank:obj;
      var count=0;
      Object.keys(bank).forEach(function(k){
        var arr=bank[k]; if(!Array.isArray(arr)) return;
        arr.forEach(function(q){
          if(!q || !q.q || !q.answer) return;
          if(!q.type) q.type=(q.options && q.options.length)?"choice":"fill";
          if(!q.source) q.source="导入";
          (state.importedBank[k]=state.importedBank[k]||[]).push(q); count++;
        });
      });
      saveState();
      var el=document.getElementById("bankMsg"); if(el) el.textContent="已导入 "+count+" 题 ✓";
    }catch(e){ alert("导入失败：JSON 格式不对。\n"+e.message); }
  };
  fr.readAsText(file);
}

/* ============ AI（知识梳理） ============ */
async function callAI(prompt){
  var s=state.settings;
  try{
    var resp=await fetch(s.baseUrl.replace(/\/$/,"")+"/chat/completions",{ method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.apiKey}, body:JSON.stringify({model:s.model, messages:[{role:"system",content:"你是严谨、简明的高考复习助教，用中文结构化输出。"},{role:"user",content:prompt}], temperature:0.3, max_tokens:2000, stream:false}) });
    if(!resp.ok){ var t=await resp.text(); return {ok:false, err:"请求失败 "+resp.status+"："+t.slice(0,300)}; }
    var data=await resp.json();
    var txt=(data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)||"(空)";
    return {ok:true, text:txt};
  }catch(e){ return {ok:false, err:"请求异常（可能浏览器跨域拦截 CORS）："+e.message}; }
}
async function generateAI(){
  var out=document.getElementById("aiOut"); var s=getSubject();
  var sel=document.getElementById("aiChapter"); var idx=sel?parseInt(sel.value):0;
  var chapter=s.chapters[idx]||s.chapters[0];
  if(!state.settings.apiKey){ out.innerHTML='<div class="error">尚未填写 API Key。请到「设置」填写后再试（此功能可选）。</div>'; return; }
  out.innerHTML='<span class="spin">正在生成「'+esc(chapter)+'」的知识梳理，请稍候…</span>';
  var prompt="你是高考复习助教。请针对【"+s.name+"】的章节「"+chapter+"」做一份基础知识梳理：\n1) 核心概念；2) 重点公式/术语；3) 常见题型与思路；4) 易错点；5) 一周复习建议。用简洁中文 markdown。";
  var r=await callAI(prompt);
  if(r.ok){ out.innerHTML=mdToHtml(r.text); } else { out.innerHTML='<div class="error">'+esc(r.err)+'</div>'; }
}

/* ============ 全局事件 ============ */
document.addEventListener("click", function(ev){
  var t=ev.target;
  var navBtn=t.closest?t.closest("button[data-nav]"):null;
  if(navBtn){ var k=navBtn.getAttribute("data-nav"); if(k.indexOf("sub:")===0){ currentSubject=k.slice(4); switchView("subject"); } else switchView(k); return; }
  var wk=t.closest?t.closest("[data-wk]"):null;
  if(wk){ showWeekDetail(parseInt(wk.getAttribute("data-wk"))); return; }
  var cp=t.closest?t.closest("[data-chapter-pill]"):null;
  if(cp){ currentChapter=cp.getAttribute("data-chapter-pill"); renderSubject(); return; }
  var ci=t.closest?t.closest("[data-checkin]"):null;
  if(ci){ checkin(ci.getAttribute("data-checkin")); return; }
  var hc=t.closest?t.closest("[data-home-checkin]"):null;
  if(hc){ checkinHome(hc.getAttribute("data-home-checkin")); return; }
  var flag=t.closest?t.closest("[data-flag]"):null;
  if(flag){ flagQuestion(parseInt(flag.getAttribute("data-flag"))); return; }
  var subj=t.closest?t.closest("[data-quiz-subj]"):null;
  if(subj){ quizSubject=subj.getAttribute("data-quiz-subj"); quizPoint=null; renderQuizPoints(); var o=document.getElementById("quizOut"); if(o) o.innerHTML=""; return; }
  var pt=t.closest?t.closest("[data-quiz-point]"):null;
  if(pt){ quizPoint=pt.getAttribute("data-quiz-point"); renderQuizPoints(); var o2=document.getElementById("quizOut"); if(o2) o2.innerHTML=""; return; }
  var act=t.closest?t.closest("[data-action]"):null;
  if(act){
    var a=act.getAttribute("data-action");
    if(a==="ai") generateAI();
    else if(a==="addVideo") addVideo();
    else if(a==="submitQuiz") submitQuiz();
    else if(a==="genQuiz") generateQuiz();
    else if(a==="goImport"){ switchView("settings"); var bf=document.getElementById("bankFile"); if(bf) bf.focus(); }
    else if(a==="saveSettings") saveSettings();
    else if(a==="saveReview") saveReview();
    else if(a==="export") exportData();
    else if(a==="import"){ var f=document.getElementById("importFile"); if(f) f.click(); }
    else if(a==="importBank"){ var bf2=document.getElementById("bankFile"); if(bf2) bf2.click(); }
    return;
  }
});
document.addEventListener("change", function(ev){
  var t=ev.target;
  var d=t.closest?t.closest("input[data-daily]"):null;
  if(d){ toggleDaily(parseInt(d.getAttribute("data-daily")), d); return; }
  var w=t.closest?t.closest("input[data-watch]"):null;
  if(w){ toggleWatched(w.getAttribute("data-watch"), w.checked); return; }
  if(t.id==="reviewWeek"){ reviewWeek=parseInt(t.value); renderReview(); return; }
  if(t.id==="setProvider"){ var p=PROVIDERS[t.value]; if(p){ document.getElementById("setBaseUrl").value=p.baseUrl; document.getElementById("setModel").value=p.model; } return; }
  if(t.id==="importFile"){ if(t.files&&t.files[0]) importData(t.files[0]); return; }
  if(t.id==="bankFile"){ if(t.files&&t.files[0]) importBank(t.files[0]); return; }
});

/* ============ 启动 ============ */
initFlow();
</script>
